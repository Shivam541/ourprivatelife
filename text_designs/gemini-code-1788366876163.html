<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria Meeting</title>
  <style>
    :root {
      --bg-dark: #0b0a10;
      --panel-bg: rgba(23, 20, 33, 0.45);
      --panel-border: rgba(212, 175, 55, 0.25);
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
      --gold-glow: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      --text-main: #f0eaf6;
      --text-muted: #a39bb0;
      --danger-bg: rgba(186, 45, 45, 0.3);
      --danger-border: rgba(220, 76, 76, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(45, 26, 71, 0.5) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(61, 35, 23, 0.4) 0px, transparent 50%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.25rem;
      gap: 1.25rem;
    }

    /* SVG Icon Styling */
    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Glassmorphic Panel Base */
    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .gold-accent-border {
      position: relative;
    }

    .gold-accent-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: var(--gold-gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Top Bar */
    header {
      height: 60px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
      letter-spacing: 1px;
      font-size: 1.1rem;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    .meeting-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Grid Area */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1.25rem;
      min-height: 0;
    }

    /* Video Tile */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated Cosmic Orbit Background for Audio-Only */
    .cosmic-orbit {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--gold-glow);
      border: 1px dashed rgba(212, 175, 55, 0.3);
      animation: spin 20s linear infinite;
    }

    .cosmic-orbit::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #d4af37;
      border-radius: 50%;
      box-shadow: 0 0 10px #d4af37;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gold-gradient);
      padding: 2px;
      position: relative;
      z-index: 2;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #13111c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: #f3e5ab;
    }

    /* Speaker Pulse Animation */
    .speaking .avatar {
      animation: pulse-gold 2s infinite ease-in-out;
    }

    @keyframes pulse-gold {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
      70% { box-shadow: 0 0 0 18px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }

    .participant-label {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 3;
      background: rgba(11, 10, 16, 0.6);
    }

    /* Controls Bar */
    footer {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: rgba(212, 175, 55, 0.5);
      transform: translateY(-2px);
    }

    .btn.active {
      background: var(--gold-gradient);
      color: #0b0a10;
      border: none;
    }

    .btn.danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: #ff8b8b;
    }

    .btn.danger:hover {
      background: rgba(186, 45, 45, 0.6);
    }
  </style>
</head>
<body>

  <header class="glass-panel gold-accent-border">
    <div class="brand">
      <svg class="icon" style="stroke: #d4af37;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span>AETHERIA <span class="gold-text">MEET</span></span>
    </div>
    <div class="meeting-info">
      <span id="time-display">--:-- PM</span>
      <span>|</span>
      <span>cosmic-nexus-09</span>
    </div>
  </header>

  <main>
    <div class="tile glass-panel gold-accent-border speaking">
      <div class="cosmic-orbit"></div>
      <div class="avatar">
        <div class="avatar-inner">EA</div>
      </div>
      <div class="participant-label glass-panel">
        <svg class="icon" style="width:14px; height:14px; stroke:#d4af37;" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
        <span>Elena Aurelia (Host)</span>
      </div>
    </div>

    <div class="tile glass-panel">
      <div class="cosmic-orbit" style="animation-duration: 25s; animation-direction: reverse;"></div>
      <div class="avatar">
        <div class="avatar-inner">VS</div>
      </div>
      <div class="participant-label glass-panel">
        <svg class="icon" style="width:14px; height:14px; stroke:#a39bb0;" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path></svg>
        <span>Vikram Sterling</span>
      </div>
    </div>

    <div class="tile glass-panel">
      <div class="cosmic-orbit" style="animation-duration: 18s;"></div>
      <div class="avatar">
        <div class="avatar-inner">CL</div>
      </div>
      <div class="participant-label glass-panel">
        <svg class="icon" style="width:14px; height:14px; stroke:#d4af37;" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path></svg>
        <span>Cassandra Lumière</span>
      </div>
    </div>

    <div class="tile glass-panel">
      <div class="cosmic-orbit" style="animation-duration: 30s;"></div>
      <div class="avatar">
        <div class="avatar-inner">YOU</div>
      </div>
      <div class="participant-label glass-panel">
        <svg class="icon" style="width:14px; height:14px; stroke:#d4af37;" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path></svg>
        <span>You</span>
      </div>
    </div>
  </main>

  <footer class="glass-panel gold-accent-border">
    <button class="btn active" id="mic-btn" title="Toggle Microphone">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>

    <button class="btn" id="cam-btn" title="Toggle Camera">
      <svg class="icon" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
    </button>

    <button class="btn" title="Share Screen">
      <svg class="icon" viewBox="0 0 24 24"><path d="M13 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"></path><polyline points="8 21 12 17 16 21"></polyline><polyline points="17 8 21 4 17 0"></polyline><line x1="21" y1="4" x2="9" y2="16"></line></svg>
    </button>

    <button class="btn" title="Reactions">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
    </button>

    <button class="btn danger" title="Leave Call">
      <svg class="icon" viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67 19.83 19.83 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
    </button>
  </footer>

  <script>
    // Live Time Updater
    function updateTime() {
      const now = new Date();
      document.getElementById('time-display').textContent = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Simple Toggle States for Interactive Controls
    const micBtn = document.getElementById('mic-btn');
    micBtn.addEventListener('click', () => {
      micBtn.classList.toggle('active');
    });

    const camBtn = document.getElementById('cam-btn');
    camBtn.addEventListener('click', () => {
      camBtn.classList.toggle('active');
    });
  </script>
</body>
</html>
